# Builds the website of a PR as a preview. Runs PR code, therefore only `pull_request`: read-only GITHUB_TOKEN, no
# secrets. docs_preview.yml (from the default branch) publishes the result at
# https://seqan.github.io/docs-preview/seqan/www.seqan.de/<pr>/ and deletes it when the PR is closed.

name: Preview

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Berlin

defaults:
  run:
    shell: bash -Eeuxo pipefail {0}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'seqan' || github.event_name == 'workflow_dispatch'
    container:
      image: docker.io/debian:bookworm
      volumes:
        - /home/runner:/home/runner
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install --yes git gh wget curl ruby-full build-essential zlib1g-dev
          gem install bundler

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The site is served below the preview's path on seqan.github.io.
      - name: Build
        env:
          BASEURL: docs-preview/${{ github.repository }}/${{ github.event.pull_request.number }}
        run: |
          bundle install --retry=20
          bundle exec jekyll build --baseurl "${BASEURL}"

      # For docs_preview.yml, which expects this artifact name.
      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: _site/
          retention-days: 7
          if-no-files-found: error
